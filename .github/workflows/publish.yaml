name: Publish Plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  verify-and-test:
    name: Verify, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor $(git rev-parse HEAD) origin/main; then
            echo "❌ Tag is not based on the main branch. Exiting."
            exit 1
          fi
          echo "✅ Tag is based on main branch"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests with coverage
        run: ./gradlew build test koverXmlReport koverVerify --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-test-results
          path: build/reports/tests/test/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: publish-coverage-report
          path: build/reports/kover/
          retention-days: 30

  qodana-check:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          pr-mode: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    needs: [verify-and-test, qodana-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The release notes are CHANGELOG.md's [Unreleased] section, the same text the Marketplace shows. Made before
      # publishing: a failure here stops the release before anything is live.
      - name: Release notes from the changelog
        run: mkdir -p build && ./gradlew getChangelog --unreleased --no-header --no-links --console=plain -q > build/release-notes.md
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}

      - name: Build and publish plugin
        run: ./gradlew patchPluginXml publishPlugin
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: build/release-notes.md
          generate_release_notes: true
          files: build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    name: Changelog pull request
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      # the released commit, not main's head: notes merged after the tag stay in [Unreleased]
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'

      # [Unreleased] becomes [<version>] - <date>, with a new empty [Unreleased] above it
      - name: Patch the changelog
        run: chmod +x gradlew && ./gradlew patchChangelog
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # safe to re-run: the branch is rebuilt and an existing pull request is kept
          BRANCH="chore/changelog-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "docs(changelog): release $VERSION" || { echo "CHANGELOG.md unchanged"; exit 0; }
          git push --force --set-upstream origin "$BRANCH"
          gh pr view "$BRANCH" > /dev/null 2>&1 || gh pr create --base main --head "$BRANCH" \
            --title "docs(changelog): release $VERSION" \
            --body "Moves the [Unreleased] notes in \`CHANGELOG.md\` under $VERSION, which was just published."
